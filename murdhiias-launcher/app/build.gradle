plugins { id 'com.android.application' }
android {
    namespace 'com.murdhiias.launcher'
    compileSdk 35
    defaultConfig {
        applicationId 'com.murdhiias.launcher'
        minSdk 29
        targetSdk 35
        versionCode 2
        versionName '1.1'
    }
    signingConfigs {
        debug {
            storeFile rootProject.file('../.github/keys/debug.keystore')
            storePassword 'android'
            keyAlias 'androiddebugkey'
            keyPassword 'android'
        }
    }
    compileOptions { sourceCompatibility JavaVersion.VERSION_17; targetCompatibility JavaVersion.VERSION_17 }
}
