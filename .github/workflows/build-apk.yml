name: Build APKs (X9c port)

on:
  push:
    branches: [ main, x9c-port ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: read
    env:
      GH_PACKAGES_USER: ${{ github.actor }}
      GH_PACKAGES_TOKEN: ${{ secrets.PKG_TOKEN || secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: app-android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APKs (OneOS + OneOS Probe)
        run: |
          chmod +x gradlew ../scripts/build-guest-manager.sh
          ../scripts/build-guest-manager.sh --debug
          ./gradlew --no-daemon :app:assembleProbeDebug :app:assembleFullDebug
      - uses: actions/upload-artifact@v4
        with:
          name: oneos-x9c-apks
          path: app-android/app/build/outputs/apk/**/*.apk
