name: Build APKs (X9c port)

on:
  push:
    branches: [ main, x9c-port ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      packages: read
    env:
      GH_PACKAGES_USER: ${{ github.actor }}
      GH_PACKAGES_TOKEN: ${{ secrets.PKG_TOKEN || secrets.GITHUB_TOKEN }}
    defaults:
      run:
        working-directory: app-android
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'
      - name: Accept Android SDK licenses
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - uses: gradle/actions/setup-gradle@v4
      - name: Build debug APKs (OneOS + OneOS Probe)
        run: |
          chmod +x gradlew ../scripts/build-guest-manager.sh
          ../scripts/build-guest-manager.sh --debug
          ./gradlew --no-daemon :app:assembleProbeDebug :app:assembleFullDebug
      - uses: actions/upload-artifact@v4
        with:
          name: oneos-probe-apk
          path: app-android/app/build/outputs/apk/probe/**/*.apk
      - uses: actions/upload-artifact@v4
        with:
          name: oneos-full-apk
          path: app-android/app/build/outputs/apk/full/**/*.apk
      - name: Publish as the x9c-latest release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: x9c-latest
          name: OneOS X9c port (latest build)
          prerelease: true
          make_latest: false
          files: |
            app-android/app/build/outputs/apk/probe/debug/*.apk
            app-android/app/build/outputs/apk/full/debug/*.apk
